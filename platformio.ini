; PlatformIO Project Configuration
; 馬達實驗室 ESP32-S3 SD 卡錄音韌體

[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
build_flags =
    -DCORE_DEBUG_LEVEL=5
    ; Route Arduino Serial to the ESP32-S3 USB Serial/JTAG interface so the
    ; same USB connection used for flashing can run the provisioning protocol.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ── 上傳 / 監控 (USB CDC OTG) ──────────────────────────────────
upload_protocol = esptool
monitor_speed   = 115200
upload_speed    = 115200

lib_deps =
    greiman/SdFat@^2.2.3
    bblanchon/ArduinoJson@^7.0.4
